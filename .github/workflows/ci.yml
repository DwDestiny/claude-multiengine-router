name: Mac mini runner validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, macmini]
    timeout-minutes: 8
    steps:
      - name: Verify isolated CI environment and GUI availability
        run: /usr/local/bin/python3.12 -I "/Library/Application Support/DwMacCI/ci-acceptance.py"
